plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtavsource.android'
    compileSdk 35

    defaultConfig {
        applicationId "com.djbrotherson.gtavturnipprobe"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
