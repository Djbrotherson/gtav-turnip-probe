name: Build GTAV Turnip Probe Native Libs

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout probe project
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p deps
          git clone --depth 1 --recursive https://github.com/bylaws/libadrenotools.git deps/libadrenotools
          git clone --depth 1 --branch v1.0.10 https://github.com/bytedance/bhook.git deps/bhook

          # ByteHook v1.0.10 enables -Weverything -Werror itself.
          # Current NDK/Clang emits compatibility warnings that become fatal.
          sed -i 's/-Weverything -Werror/-Weverything/' \
            deps/bhook/bytehook/src/main/cpp/CMakeLists.txt

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
          -DCMAKE_C_STANDARD=99 \
          -DCMAKE_C_EXTENSIONS=ON \
          -DCMAKE_C_FLAGS="-Wno-error=declaration-after-statement"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Collect libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          for lib in libdriverhook.so libprobeonly.so libdirectload.so libturnip.so libmain_hook.so libhook_impl.so libbytehook.so; do
            p="$(find build -type f -name "$lib" -print -quit)"
            test -n "$p"
            cp -v "$p" "dist/$lib"
          done
          file dist/*.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h dist/libdriverhook.so
          sha256sum dist/*.so | tee dist/SHA256SUMS.txt

      - name: Upload probe native libraries
        uses: actions/upload-artifact@v4
        with:
          name: gtav-turnip-probe-arm64
          path: dist/
          if-no-files-found: error
          compression-level: 9

      - name: Stage native libraries for probe APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          rm -rf app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp dist/libdirectload.so app/src/main/jniLibs/arm64-v8a/

          # Recreate the real T28 driver after jniLibs was cleaned above.
          rm -rf /tmp/gtav-t28
          mkdir -p /tmp/gtav-t28
          unzip -q app/src/main/assets/driver.zip -d /tmp/gtav-t28

          DRIVER_LIB=$(python3 -c 'import json; print(json.load(open("/tmp/gtav-t28/meta.json"))["libraryName"])')

          echo "T28 library from meta.json: $DRIVER_LIB"

          test -f "/tmp/gtav-t28/$DRIVER_LIB"

          cp "/tmp/gtav-t28/$DRIVER_LIB" \
             app/src/main/jniLibs/arm64-v8a/libturnip.so

          test -f app/src/main/jniLibs/arm64-v8a/libturnip.so

          file app/src/main/jniLibs/arm64-v8a/libturnip.so
          cp dist/libprobeonly.so app/src/main/jniLibs/arm64-v8a/
          cp dist/libmain_hook.so app/src/main/jniLibs/arm64-v8a/
          cp dist/libhook_impl.so app/src/main/jniLibs/arm64-v8a/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build standalone probe APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug
          ls -lh app/build/outputs/apk/debug/

      - name: Upload standalone probe APK
        uses: actions/upload-artifact@v4
        with:
          name: gtav-turnip-probe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
