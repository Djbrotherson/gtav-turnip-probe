name: Build GTAV Turnip Probe Native Libs

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout probe project
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p deps
          git clone --depth 1 --recursive https://github.com/bylaws/libadrenotools.git deps/libadrenotools
          git clone --depth 1 --branch v1.0.10 https://github.com/bytedance/bhook.git deps/bhook

          # ByteHook v1.0.10 enables -Weverything -Werror itself.
          # Current NDK/Clang emits compatibility warnings that become fatal.
          sed -i 's/-Weverything -Werror/-Weverything/' \
            deps/bhook/bytehook/src/main/cpp/CMakeLists.txt

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
          -DCMAKE_C_STANDARD=99 \
          -DCMAKE_C_EXTENSIONS=ON \
          -DCMAKE_C_FLAGS="-Wno-error=declaration-after-statement"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Collect libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          for lib in libdriverhook.so libmain_hook.so libhook_impl.so libbytehook.so; do
            p="$(find build -type f -name "$lib" -print -quit)"
            test -n "$p"
            cp -v "$p" "dist/$lib"
          done
          file dist/*.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h dist/libdriverhook.so
          sha256sum dist/*.so | tee dist/SHA256SUMS.txt

      - name: Upload probe native libraries
        uses: actions/upload-artifact@v4
        with:
          name: gtav-turnip-probe-arm64
          path: dist/
          if-no-files-found: error
          compression-level: 9
